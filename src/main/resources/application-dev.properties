# Local development reads the untracked Docker environment file.
spring.config.import=optional:file:./.env[.properties]
# Local development only: dedicated database, never the old ecommerce database.
spring.datasource.url=jdbc:mysql://127.0.0.1:${DEV_DB_PORT:3306}/3dl_checkout_dev?allowPublicKeyRetrieval=true&sslMode=PREFERRED
spring.datasource.username=${DEV_DB_USERNAME:3dl_dev}
spring.datasource.password=${DEV_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
checkout.quote-secret-base64=${CHECKOUT_QUOTE_SECRET_BASE64}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/checkout-v2
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.create-schemas=false
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
app.data-initializer.enabled=${DEV_DEMO_DATA:false}
# HTTP on loopback; cookies stay HttpOnly and SameSite=Lax.
server.address=127.0.0.1
server.port=9085
server.servlet.session.cookie.secure=false
server.shutdown=graceful
