# Mandatory protected settings: there are deliberately no historical defaults.
spring.datasource.url=${CHECKOUT_V2_DB_URL}
spring.datasource.username=${CHECKOUT_V2_DB_USERNAME}
spring.datasource.password=${CHECKOUT_V2_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
checkout.quote-secret-base64=${CHECKOUT_QUOTE_SECRET_BASE64}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never
app.data-initializer.enabled=false
spring.h2.console.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.shutdown=graceful

# Terminate HTTPS at an explicitly configured local reverse proxy.
server.address=127.0.0.1
server.port=9086
