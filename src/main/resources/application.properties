spring.application.name=ecommerce
payments.stripe.enabled=false
product.images.directory=${user.home}/.3dl/product-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# No implicit datasource: use the explicit dev profile.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never
app.data-initializer.enabled=false
spring.h2.console.enabled=false
server.address=127.0.0.1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@3dl.test}
app.mail.public-url=${APP_PUBLIC_URL:http://127.0.0.1:9085}
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
