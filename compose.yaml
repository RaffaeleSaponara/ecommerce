name: 3dl
services:
  mysql:
    image: mysql:8.4.3
    container_name: 3dl-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: 3dl_checkout_dev
      MYSQL_USER: ${DEV_DB_USERNAME:-3dl_dev}
      MYSQL_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    labels:
      com.3dl.project: ecommerce
      com.3dl.environment: dev
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
volumes:
  mysql-data:
    name: 3dl_mysql_dev_data
    labels:
      com.3dl.project: ecommerce
      com.3dl.environment: dev
